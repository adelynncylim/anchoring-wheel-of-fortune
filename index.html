<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presentation Section Randomizer</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
    }
    .wheel-pointer {
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 sm:p-6 lg:p-8">

  <!-- Main Container -->
  <div class="w-full max-w-6xl mx-auto flex flex-col gap-8">
    
    <!-- Top Header -->
    <header class="text-center space-y-2">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold tracking-wide uppercase">
        <span>Team Randomizer</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">
        Presentation Section Picker
      </h1>
      <p class="text-slate-400 text-sm max-w-lg mx-auto">
        5 structured roles. 5 teammates. Spin the wheel to randomly assign each section in order.
      </p>
    </header>

    <!-- Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- Left Column: Wheel & Controls -->
      <div class="lg:col-span-7 flex flex-col items-center bg-slate-900/60 border border-slate-800 rounded-3xl p-6 sm:p-8 backdrop-blur-sm relative shadow-2xl">
        
        <!-- Target Section Status Bar -->
        <div id="target-banner" class="w-full bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 mb-6 flex items-center justify-between transition-all">
          <div class="flex items-center gap-3">
            <span class="flex h-3 w-3 relative">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </span>
            <div>
              <div class="text-xs font-medium text-slate-400 uppercase tracking-wider">Currently Assigning</div>
              <div id="target-title" class="text-base font-bold text-white">PART 1: HOOK — Capture Attention</div>
            </div>
          </div>
          <span id="step-counter" class="text-xs font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-3 py-1 rounded-full">
            1 of 5
          </span>
        </div>

        <!-- Wheel Canvas Area -->
        <div class="relative flex items-center justify-center my-2">
          <!-- Pointer (Right side pointing inward) -->
          <div class="absolute -right-3 top-1/2 -translate-y-1/2 z-20 pointer-events-none wheel-pointer">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" class="text-rose-500 transform rotate-180 drop-shadow-lg">
              <polygon points="4,2 20,12 4,22" fill="currentColor"/>
            </svg>
          </div>

          <!-- Wheel Canvas -->
          <canvas id="wheelCanvas" width="460" height="460" class="max-w-full h-auto rounded-full shadow-2xl border-4 border-slate-800/80"></canvas>

          <!-- Center Spin Hub Button -->
          <button id="spinBtn" class="absolute z-10 w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-gradient-to-tr from-slate-950 to-slate-800 border-4 border-slate-700 hover:border-indigo-400 text-white font-bold text-base sm:text-lg shadow-xl flex flex-col items-center justify-center gap-0.5 transition-all transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed group">
            <span class="tracking-wider group-hover:text-indigo-300 transition-colors">SPIN</span>
            <span class="text-[10px] text-slate-400 font-normal">CLICK</span>
          </button>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-3 mt-6 w-full max-w-sm">
          <button id="autoAssignBtn" class="flex-1 py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-slate-300 transition-all flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            Auto Assign Remaining
          </button>
          <button id="resetBtn" class="py-2.5 px-4 rounded-xl bg-slate-800/50 hover:bg-rose-950/40 hover:border-rose-800/60 border border-slate-800 text-xs font-medium text-slate-400 hover:text-rose-300 transition-all">
            Reset
          </button>
        </div>

      </div>

      <!-- Right Column: Roster & Output Board -->
      <div class="lg:col-span-5 flex flex-col gap-4">
        
        <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 backdrop-blur-sm shadow-xl">
          <div class="flex items-center justify-between mb-5">
            <div class="flex items-center gap-2">
              <span class="text-xl">📋</span>
              <h2 class="text-lg font-bold text-white">Presentation Roster</h2>
            </div>
            <span id="assigned-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">
              0 / 5 Assigned
            </span>
          </div>

          <!-- Roster Cards List -->
          <div id="rosterList" class="flex flex-col gap-3">
            <!-- Rendered dynamically by script -->
          </div>

          <!-- Post-Assignment Action Bar -->
          <div class="mt-6 pt-5 border-t border-slate-800 flex flex-col gap-2.5">
            <button id="downloadBtn" disabled class="w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 disabled:text-slate-500 disabled:cursor-not-allowed font-semibold text-white text-sm shadow-lg shadow-emerald-950/30 transition-all flex items-center justify-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              <span>Download Outcome Image (PNG)</span>
            </button>
            <button id="copyBtn" disabled class="w-full py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-xs font-medium text-slate-300 transition-all flex items-center justify-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
              <span>Copy Assignments to Clipboard</span>
            </button>
          </div>
        </div>

        <!-- Remaining Team List -->
        <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4">
          <div class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">In the Pool</div>
          <div id="poolTags" class="flex flex-wrap gap-2">
            <!-- Pool tags inserted dynamically -->
          </div>
        </div>

      </div>

    </div>

  </div>

  <!-- Offscreen canvas for crisp outcome image generation -->
  <canvas id="exportCanvas" width="1200" height="960" style="display: none;"></canvas>

  <script>
    // --- Data Definitions ---
    const INITIAL_NAMES = ['Adelynn', 'Em', 'Ray', 'Bob', 'Maria'];
    const SECTIONS = [
      { id: 1, label: 'PART 1', title: 'HOOK — Capture Attention', icon: '🎣' },
      { id: 2, label: 'PART 2', title: 'WHY — WIIFM', icon: '💡' },
      { id: 3, label: 'PART 3', title: 'WHAT IS IT (Anchoring)?', icon: '⚓' },
      { id: 4, label: 'PART 4', title: 'HOW — Steps', icon: '🪜' },
      { id: 5, label: 'PART 5', title: 'Recap-CTA', icon: '🎯' }
    ];

    const PALETTE = [
      '#6366f1', // Indigo
      '#ec4899', // Pink
      '#10b981', // Emerald
      '#f59e0b', // Amber
      '#06b6d4', // Cyan
    ];

    // State
    let currentPool = [...INITIAL_NAMES];
    let assignments = {}; // sectionId -> name
    let currentStep = 0; // 0 to 4 index into SECTIONS
    let isSpinning = false;
    let rotationAngle = 0; // in radians

    // Audio Context (Web Audio procedural clicks)
    let audioCtx = null;
    function playTick() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(650, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      } catch (e) {}
    }

    function playFanfare() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(freq, now + idx * 0.09);
          gain.gain.setValueAtTime(0.18, now + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.09);
          osc.stop(now + idx * 0.09 + 0.35);
        });
      } catch (e) {}
    }

    // Canvas Wheel Setup
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = canvas.width / 2 - 16;

    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentPool.length === 0) {
        // Empty finished state
        ctx.save();
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
        ctx.fillStyle = '#1e293b';
        ctx.fill();
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 20px Plus Jakarta Sans, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('All Roles Assigned!', centerX, centerY);
        ctx.restore();
        return;
      }

      const numSlices = currentPool.length;
      const sliceAngle = (2 * Math.PI) / numSlices;

      for (let i = 0; i < numSlices; i++) {
        const start = rotationAngle + i * sliceAngle;
        const end = start + sliceAngle;

        // Slice shape
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = PALETTE[i % PALETTE.length];
        ctx.fill();
        ctx.strokeStyle = '#0b0f19';
        ctx.lineWidth = 4;
        ctx.stroke();

        // Label
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(start + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px Plus Jakarta Sans, sans-serif';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 6;
        ctx.fillText(currentPool[i], radius - 36, 0);
        ctx.restore();
      }

      // Outer rim
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 6;
      ctx.stroke();
    }

    // Render HTML Roster Cards
    function renderRoster() {
      const rosterList = document.getElementById('rosterList');
      rosterList.innerHTML = '';

      SECTIONS.forEach((sec, idx) => {
        const assignedName = assignments[sec.id];
        const isCurrent = currentStep === idx && !assignedName;

        const card = document.createElement('div');
        card.className = `p-3.5 rounded-2xl border transition-all flex items-center justify-between ${
          assignedName 
            ? 'bg-slate-800/90 border-slate-700/80' 
            : isCurrent 
              ? 'bg-indigo-950/40 border-indigo-500/50 shadow-md shadow-indigo-950/50' 
              : 'bg-slate-900/30 border-slate-800/60 opacity-60'
        }`;

        card.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="text-xl">${sec.icon}</span>
            <div>
              <div class="text-[11px] font-bold ${isCurrent ? 'text-indigo-400' : 'text-slate-400'} tracking-wider">${sec.label}</div>
              <div class="text-sm font-semibold text-white leading-tight">${sec.title}</div>
            </div>
          </div>
          <div>
            ${
              assignedName
                ? `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl bg-indigo-500/20 border border-indigo-400/40 text-indigo-300 font-bold text-xs">
                     ✓ ${assignedName}
                   </span>`
                : isCurrent
                  ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-[11px] font-medium animate-pulse">
                       Next up
                     </span>`
                  : `<span class="text-xs text-slate-600 font-medium">Pending</span>`
            }
          </div>
        `;
        rosterList.appendChild(card);
      });

      // Update counters & target status
      const assignedCount = Object.keys(assignments).length;
      document.getElementById('assigned-badge').textContent = `${assignedCount} / 5 Assigned`;

      if (assignedCount < 5) {
        document.getElementById('target-title').textContent = `${SECTIONS[currentStep].label}: ${SECTIONS[currentStep].title}`;
        document.getElementById('step-counter').textContent = `${currentStep + 1} of 5`;
      } else {
        document.getElementById('target-title').textContent = 'All 5 Sections Successfully Assigned!';
        document.getElementById('step-counter').textContent = 'Completed';
      }

      // Update remaining pool tags
      const poolContainer = document.getElementById('poolTags');
      poolContainer.innerHTML = '';
      if (currentPool.length === 0) {
        poolContainer.innerHTML = `<span class="text-xs text-slate-500 italic">All names assigned</span>`;
      } else {
        currentPool.forEach(name => {
          const pill = document.createElement('span');
          pill.className = 'px-3 py-1 rounded-xl bg-slate-800 border border-slate-700 text-xs font-medium text-slate-300';
          pill.textContent = name;
          poolContainer.appendChild(pill);
        });
      }

      // Buttons
      const isComplete = assignedCount === 5;
      document.getElementById('downloadBtn').disabled = !isComplete;
      document.getElementById('copyBtn').disabled = !isComplete;
      document.getElementById('spinBtn').disabled = isSpinning || isComplete;
      document.getElementById('autoAssignBtn').disabled = isSpinning || isComplete;
    }

    // Wheel Spin Engine
    function spinWheel() {
      if (isSpinning || currentPool.length === 0 || currentStep >= 5) return;

      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;

      // Random target slice selection
      const numSlices = currentPool.length;
      const targetIndex = Math.floor(Math.random() * numSlices);
      const sliceAngle = (2 * Math.PI) / numSlices;

      // Pointer is on the right side: angle 0 radians
      // Slice i spans from: [rotation + i * sliceAngle] to [rotation + (i + 1) * sliceAngle]
      // We want pointer angle (0) to land inside target slice:
      // (rotation + targetIndex * sliceAngle + sliceAngle / 2) = 0 (mod 2PI)
      const targetMiddle = targetIndex * sliceAngle + sliceAngle / 2;
      const extraRounds = (5 + Math.floor(Math.random() * 3)) * (2 * Math.PI); // 5-7 full spins

      const currentMod = rotationAngle % (2 * Math.PI);
      const desiredEndAngle = rotationAngle + (2 * Math.PI - (targetMiddle % (2 * Math.PI))) - currentMod + extraRounds;

      const startAngle = rotationAngle;
      const totalDelta = desiredEndAngle - startAngle;
      const duration = 4000; // ms
      const startTime = performance.now();
      let lastTickAngle = startAngle;

      function animate(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / duration, 1);
        // Ease out cubic
        const easeOut = 1 - Math.pow(1 - progress, 3);

        rotationAngle = startAngle + totalDelta * easeOut;

        // Sound tick on passing slice boundaries
        if (Math.abs(rotationAngle - lastTickAngle) >= sliceAngle * 0.8) {
          playTick();
          lastTickAngle = rotationAngle;
        }

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          finalizeAssignment(targetIndex);
        }
      }

      requestAnimationFrame(animate);
    }

    // Handle Assignment Completion & Auto-Assignment of the Last Person
    function finalizeAssignment(assignedIndex) {
      const winner = currentPool[assignedIndex];
      const targetSection = SECTIONS[currentStep];

      assignments[targetSection.id] = winner;
      currentPool.splice(assignedIndex, 1);
      currentStep++;

      playFanfare();
      confetti({
        particleCount: 50,
        spread: 60,
        origin: { y: 0.7 }
      });

      renderRoster();
      drawWheel();

      // AUTO-ASSIGN LAST PERSON LOGIC:
      // If exactly 1 person remains and Part 5 is pending, automatically assign them without waiting for spin
      if (currentPool.length === 1 && currentStep === 4) {
        setTimeout(() => {
          const lastWinner = currentPool[0];
          const finalSection = SECTIONS[4];

          assignments[finalSection.id] = lastWinner;
          currentPool = [];
          currentStep = 5;

          renderRoster();
          drawWheel();

          playFanfare();
          // Grand finale celebration burst
          confetti({
            particleCount: 150,
            spread: 90,
            origin: { y: 0.5 }
          });
        }, 1100);
      } else if (currentStep === 5) {
        // Complete
        confetti({
          particleCount: 120,
          spread: 80,
          origin: { y: 0.5 }
        });
      }
    }

    // Auto Assign All Remaining Instantly
    function autoAssignAll() {
      if (isSpinning || currentStep >= 5) return;

      while (currentPool.length > 0 && currentStep < 5) {
        const randIndex = Math.floor(Math.random() * currentPool.length);
        const winner = currentPool[randIndex];
        assignments[SECTIONS[currentStep].id] = winner;
        currentPool.splice(randIndex, 1);
        currentStep++;
      }

      renderRoster();
      drawWheel();
      playFanfare();
      confetti({
        particleCount: 120,
        spread: 90,
        origin: { y: 0.5 }
      });
    }

    // Reset Function
    function resetAll() {
      currentPool = [...INITIAL_NAMES];
      assignments = {};
      currentStep = 0;
      isSpinning = false;
      rotationAngle = 0;
      renderRoster();
      drawWheel();
    }

    // Dedicated HTML5 Canvas Export Generator (Solves DOM capture distortion)
    function generateAndDownloadImage() {
      const expCanvas = document.getElementById('exportCanvas');
      const eCtx = expCanvas.getContext('2d');
      const w = expCanvas.width;
      const h = expCanvas.height;

      // Background Gradient
      const grad = eCtx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#0b0f19');
      grad.addColorStop(1, '#111827');
      eCtx.fillStyle = grad;
      eCtx.fillRect(0, 0, w, h);

      // Border outline
      eCtx.strokeStyle = '#1e293b';
      eCtx.lineWidth = 12;
      eCtx.strokeRect(6, 6, w - 12, h - 12);

      // Header Tag
      eCtx.fillStyle = '#6366f1';
      eCtx.font = 'bold 20px Plus Jakarta Sans, sans-serif';
      eCtx.fillText('OFFICIAL DRAW RESULTS', 80, 90);

      // Title
      eCtx.fillStyle = '#ffffff';
      eCtx.font = 'bold 44px Plus Jakarta Sans, sans-serif';
      eCtx.fillText('Presentation Section Roster', 80, 145);

      // Subtitle
      eCtx.fillStyle = '#94a3b8';
      eCtx.font = '22px Plus Jakarta Sans, sans-serif';
      eCtx.fillText('5-Part Structured Delivery Flow', 80, 185);

      // Status Pill Right
      eCtx.fillStyle = '#10b98120';
      eCtx.beginPath();
      eCtx.roundRect(w - 290, 100, 210, 48, 24);
      eCtx.fill();
      eCtx.strokeStyle = '#10b98160';
      eCtx.lineWidth = 2;
      eCtx.stroke();

      eCtx.fillStyle = '#34d399';
      eCtx.font = 'bold 20px Plus Jakarta Sans, sans-serif';
      eCtx.textAlign = 'center';
      eCtx.fillText('✓ 5 / 5 Assigned', w - 185, 131);
      eCtx.textAlign = 'left';

      // 5 Rows
      const rowStartY = 240;
      const rowHeight = 110;
      const rowGap = 16;

      SECTIONS.forEach((sec, i) => {
        const y = rowStartY + i * (rowHeight + rowGap);
        const assigned = assignments[sec.id] || 'Unassigned';

        // Row Box
        eCtx.fillStyle = '#1e293b70';
        eCtx.beginPath();
        eCtx.roundRect(80, y, w - 160, rowHeight, 20);
        eCtx.fill();
        eCtx.strokeStyle = '#334155';
        eCtx.lineWidth = 2;
        eCtx.stroke();

        // Icon Box
        eCtx.fillStyle = '#33415580';
        eCtx.beginPath();
        eCtx.roundRect(104, y + 20, 70, 70, 16);
        eCtx.fill();

        eCtx.font = '36px Plus Jakarta Sans, sans-serif';
        eCtx.textAlign = 'center';
        eCtx.textBaseline = 'middle';
        eCtx.fillText(sec.icon, 139, y + 55);

        // Section Title & Label
        eCtx.textAlign = 'left';
        eCtx.textBaseline = 'alphabetic';
        eCtx.fillStyle = '#818cf8';
        eCtx.font = 'bold 18px Plus Jakarta Sans, sans-serif';
        eCtx.fillText(sec.label, 196, y + 46);

        eCtx.fillStyle = '#f8fafc';
        eCtx.font = 'bold 26px Plus Jakarta Sans, sans-serif';
        eCtx.fillText(sec.title, 196, y + 80);

        // Assignee Pill Badge (Right side)
        const badgeW = 240;
        const badgeH = 58;
        const badgeX = w - 80 - badgeW - 24;
        const badgeY = y + (rowHeight - badgeH) / 2;

        eCtx.fillStyle = PALETTE[i % PALETTE.length];
        eCtx.beginPath();
        eCtx.roundRect(badgeX, badgeY, badgeW, badgeH, 16);
        eCtx.fill();

        eCtx.fillStyle = '#ffffff';
        eCtx.font = 'bold 24px Plus Jakarta Sans, sans-serif';
        eCtx.textAlign = 'center';
        eCtx.textBaseline = 'middle';
        eCtx.fillText(`✓  ${assigned}`, badgeX + badgeW / 2, badgeY + badgeH / 2);
        eCtx.textAlign = 'left';
      });

      // Footer
      eCtx.fillStyle = '#64748b';
      eCtx.font = '18px Plus Jakarta Sans, sans-serif';
      eCtx.textBaseline = 'alphabetic';
      const dateStr = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      eCtx.fillText(`Generated on ${dateStr} • Random Presentation Assignment Wheel`, 80, h - 45);

      // Trigger Download
      const link = document.createElement('a');
      link.download = `presentation_roster_${new Date().toISOString().slice(0,10)}.png`;
      link.href = expCanvas.toDataURL('image/png');
      link.click();
    }

    // Copy to Clipboard
    function copyToClipboard() {
      const lines = SECTIONS.map(s => `${s.label} (${s.title}): ${assignments[s.id] || 'TBD'}`);
      const text = `📋 Presentation Roster Assignments:\n\n` + lines.join('\n');
      navigator.clipboard.writeText(text).then(() => {
        const copyBtn = document.getElementById('copyBtn');
        const origText = copyBtn.innerHTML;
        copyBtn.innerHTML = `✓ Copied to Clipboard!`;
        setTimeout(() => { copyBtn.innerHTML = origText; }, 2000);
      });
    }

    // Event Listeners
    document.getElementById('spinBtn').addEventListener('click', spinWheel);
    document.getElementById('autoAssignBtn').addEventListener('click', autoAssignAll);
    document.getElementById('resetBtn').addEventListener('click', resetAll);
    document.getElementById('downloadBtn').addEventListener('click', generateAndDownloadImage);
    document.getElementById('copyBtn').addEventListener('click', copyToClipboard);

    // Initial setup
    renderRoster();
    drawWheel();
  </script>
</body>
</html>
